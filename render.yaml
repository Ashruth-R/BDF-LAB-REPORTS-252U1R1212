services:
  - type: web
    name: bdf-lab-01-express
    runtime: node
    plan: free
    rootDir: lab-01
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20

  - type: web
    name: bdf-lab-02-sqlite-crud
    runtime: node
    plan: free
    rootDir: lab-02
    buildCommand: npm install && npm run init:db
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
